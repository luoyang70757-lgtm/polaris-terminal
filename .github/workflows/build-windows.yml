name: Build & Release

# 在 GitHub runner 上原生编译 Windows 便携版 + macOS 版(兼容 Win10/11 / macOS)。
# 触发:
#   - push 到 main → 只传 Actions Artifact(不发布)
#   - 打标签 v* → 编译两平台并发布到 Releases(自动发布)
#   - 手动触发(workflow_dispatch,可填 version)→ 编译两平台并发布到 Releases(草稿)
# 产物:release/Polaris <version>.exe(Windows portable)、release/Polaris-<version>-mac.zip(macOS .app 压缩包)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(用于 Release 标签,留空自动用 Build+运行号)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows portable
        run: npm run dist -- --win
      - name: Upload portable exe (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: win-portable
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build macOS app (x64 仅 Intel;arm64 不编译)
        run: npm run dist -- --mac --x64
      - name: Read version
        id: ver
        shell: bash
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Zip .app (.app 是目录,GitHub Release 需要单文件;仅 x64)
        shell: bash
        run: |
          [ -d release/mac/Polaris.app ] || { echo "release/mac/Polaris.app 不存在"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent release/mac/Polaris.app "release/Polaris-${{ steps.ver.outputs.v }}-mac-x64.zip"
          ls -la release/Polaris-*-mac-*.zip
      - name: Upload macOS zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: release/Polaris-*-mac-*.zip
          if-no-files-found: error

  # 两平台都编译完 → 汇总发布(避免两个 job 并发建 Release 冲突)
  release:
    needs: [ build-windows, build-macos ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要(默认 GITHUB_TOKEN 无写权限)
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # 计算 Release 标签/名称:标签触发用标签名,手动触发用 version 或 Build+运行号
      - name: Compute release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
            if [ -z "$v" ]; then v="Build-${{ github.run_number }}"; fi
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
            echo "name=${v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Polaris ${{ steps.rel.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: false

  # 发布完成后把产物发布到 GitHub Releases(见上方 release job)。
  # 编译产物不再同步到 gitee(用户决定:gitee 只保留源码仓库,不镜像二进制)。
