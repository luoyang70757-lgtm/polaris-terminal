name: Build & Release

# 在 GitHub runner 上原生编译 Windows 便携版(兼容 Win10/11)。macOS/Linux 不发布(用户决定)。
# 触发:
#   - push 到 main → 只传 Actions Artifact(不发布)
#   - 打标签 v* → 编译 Windows 并发布到 Releases(自动发布)
#   - 手动触发(workflow_dispatch,可填 version)→ 编译 Windows 并发布到 Releases(草稿)
# 产物:
#   release/Polaris Setup <version>.exe    NSIS 安装版(启动快,推荐)
#   release/Polaris Portable <version>.exe portable 免安装版(每次启动自解压,较慢)
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(用于 Release 标签,留空自动用 Build+运行号)'
        required: false
        default: ''

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows packages
        # 发布统一交给下面的 release job（softprops/action-gh-release + GITHUB_TOKEN）。
        # 必须显式 --publish never：electron-builder 26 在 tag 构建时会尝试隐式发布，
        # 而 build job 没有 GH_TOKEN → 打包完成后报错退出（NSIS target 会触发）。
        run: npm run dist -- --win --publish never
      - name: Upload Windows packages (artifact)
        uses: actions/upload-artifact@v7
        with:
          name: win-packages
          path: |
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  # Windows 编译完 → 汇总发布(避免并发建 Release 冲突)
  release:
    needs: [ build-windows ]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 创建 GitHub Release 需要(默认 GITHUB_TOKEN 无写权限)
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      # 计算 Release 标签/名称:标签触发用标签名,手动触发用 version 或 Build+运行号
      - name: Compute release tag
        id: rel
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
            if [ -z "$v" ]; then v="Build-${{ github.run_number }}"; fi
            echo "tag=v${v}" >> "$GITHUB_OUTPUT"
            echo "name=${v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/latest*.yml
            artifacts/**/*.blockmap
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Polaris ${{ steps.rel.outputs.name }}
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          generate_release_notes: false

  # 发布完成后把产物发布到 GitHub Releases(见上方 release job)。
  # 编译产物不再同步到 gitee(用户决定:gitee 只保留源码仓库,不镜像二进制)。
