<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>Polaris · 解锁</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: flex-start; justify-content: center;
      padding-top: 26px; overflow-y: auto; /* 顶部开始排列,内容超高可滚动,不会裁掉 logo */
      background: radial-gradient(ellipse at 50% 30%, #0e1d40 0%, #070c18 70%); }
    .lock-box { width: 300px; display: flex; flex-direction: column; gap: 10px; }
    .lock-logo { font-size: 26px; font-weight: 800; color: var(--accent); text-align: center; letter-spacing: 1px; }
    .lock-title { text-align: center; color: var(--text); font-size: 14px; }
    .lock-box input {
      padding: 9px 12px; font-size: 14px; background: var(--input-bg, #1a1b1e);
      border: 1px solid var(--border); border-radius: 6px; color: var(--text); outline: none;
    }
    .lock-box input:focus { border-color: var(--accent); }
    .lock-box .btn-primary { padding: 10px; font-size: 14px; }
    .lock-msg { color: var(--orange); font-size: 12px; text-align: center; min-height: 16px; }
    .lock-note { color: var(--text-dim); font-size: 11px; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="lock-box">
    <div class="lock-logo">✦ Polaris</div>
    <div id="lock-title" class="lock-title">设置密码</div>
    <input id="pw" type="password" placeholder="输入密码" autofocus />
    <input id="pw2" type="password" placeholder="再次确认密码" style="display:none" />
    <button id="btn" class="btn-primary">设置并进入</button>
    <div id="lock-msg" class="lock-msg"></div>
    <div id="lock-note" class="lock-note"></div>
  </div>
  <script src="lock.js"></script>
</body>
</html>
